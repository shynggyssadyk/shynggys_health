html{-webkit-text-size-adjust:100%;scroll-padding-top:124px}
body{background:var(--bg);color:var(--ink);font:350 17px/1.5 Geologica,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.box{max-width:720px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:5;background:#FAF8F4;border-bottom:1px solid var(--line)}

.lk b{display:block;width:max-content;font-weight:600;font-size:13.5px;line-height:1.1}.lk span{display:block;width:max-content;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--acc);margin-top:2px}
.chat{font-size:14.5px;color:var(--acc);font-weight:500;padding:12px 0 12px 12px;margin-left:auto;white-space:nowrap}.top .sep{width:1px;height:28px;background:#C9C1B3;margin:0 10px}.top .mark{height:15px;opacity:.95}@media(max-width:400px){.top .sep,.top .mark{display:none}.chat{font-size:13px;padding-left:8px}.top .sl i{font-size:8px}.top .sl b{font-size:9.6px}}
.lo{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;padding:12px 0;min-height:44px;cursor:pointer}.btn.w{background:#fff;color:var(--ink);margin-top:14px}.btn:focus-visible,.ih:focus-visible,.row:focus-visible,.tabs button:focus-visible,.lo:focus-visible{outline:3px solid #13285b;outline-offset:2px}button[disabled]{opacity:.6}

.hero{padding:28px 0 6px}

.tabs button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(19,40,91,.08)}
.item{border-bottom:1px solid var(--line)}
.ih{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px 0;min-height:68px}
.num{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:19px;color:var(--acc);margin-right:6px}
.st{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px}
.st.d{background:var(--acc);color:#fff}.st.n{border:1.5px solid #CFC8BB}.st.c{border:2px solid var(--acc);color:var(--acc);font-size:9px;padding-left:2px}
.chev{color:var(--sm);font-size:18px;transition:transform .25s;flex:none}.open .chev{transform:rotate(180deg)}
.ib{display:none;padding:0 0 18px 40px}.open .ib{display:block}
.ib .about{font-size:15px;color:var(--mut);margin-bottom:10px}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;background:var(--acc);color:#fff;font-weight:500;font-size:16px}
.btn.s{background:#fff;color:var(--ink);border:1px solid #DDD7CC}

.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mg',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kget(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('k').objectStore('k').get('key');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function kput(k){try{const db=await idb();await new Promise(r=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(k,'key');t.oncomplete=r;t.onerror=r})}catch(e){}}
async function kdel(){try{const db=await idb();await new Promise(r=>{const t=db.transaction('k','readwrite');t.objectStore('k').delete('key');t.oncomplete=r;t.onerror=r})}catch(e){}try{localStorage.removeItem('mg_key')}catch(e){}}
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:BLOB.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(code){const e=BLOB.u[code.slice(2,6)];if(!e)throw 0;const uk=await derive(code,e.s);const prof=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},uk,b64(e.w))));

async function decryptData(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(pt))}

const norm=s=>lay(s.normalize('NFKC').toLowerCase()).replace(/[^a-z0-9]/g,'');
function cands(v){const out=[];const t=lay(v.normalize('NFKC').toLowerCase());(t.match(/mg[\s\-–—_]*[a-z0-9]{4}[\s\-–—_]*[a-z0-9]{8}/g)||[]).forEach(x=>out.push(x.replace(/[^a-z0-9]/g,'')));const n=norm(v);if(n.startsWith('mg'))out.push(n.slice(0,14));out.push(n);if(!n.startsWith('mg')&&n.length===12)out.push('mg'+n);return [...new Set(out)].filter(x=>x.length===14&&x.startsWith('mg')).slice(0,6)}
