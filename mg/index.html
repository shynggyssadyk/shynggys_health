<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF8F4">
<title>Метаболическая грамотность · кабинет</title>
<link rel="icon" href="avatar.png">
<style>
@font-face{font-family:Geologica;font-weight:100 900;font-display:swap;src:url(fonts/Geologica-cyrillic-189ca8.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-04FF,U+2116}
@font-face{font-family:Geologica;font-weight:100 900;font-display:swap;src:url(fonts/Geologica-latin-d17690.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20B8,U+2190-2193,U+2212}
@font-face{font-family:'Source Serif 4';font-style:italic;font-weight:200 900;font-display:swap;src:url(fonts/SourceSerif4-cyrillic-cbd890.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-04FF,U+2116}
@font-face{font-family:'Source Serif 4';font-style:italic;font-weight:200 900;font-display:swap;src:url(fonts/SourceSerif4-latin-a6fe03.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#FAF8F4;--ink:#13285b;--mut:#5A6683;--sm:#6B7590;--line:#ECE8E0;--acc:#14808a;--accbg:#E6F2F2;--soft:#F0ECE4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:350 17px/1.5 Geologica,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.box{max-width:720px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:5;background:rgba(250,248,244,.96);border-bottom:1px solid var(--line)}
.top .box{display:flex;align-items:center;justify-content:space-between;height:64px}
.lk{display:flex;align-items:center;gap:10px}.lk img{width:36px;height:36px;border-radius:50%}
.lk b{display:block;font-weight:600;font-size:13.5px;letter-spacing:.04em;line-height:1.2}.lk span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--acc)}
.chat{font-size:14.5px;color:var(--acc);font-weight:500;padding:10px 0 10px 12px}
.kick{font-size:12.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
h1{font-size:clamp(30px,8vw,40px);font-weight:450;line-height:1.1;letter-spacing:-.025em}
h2{font-size:clamp(24px,6.4vw,30px);font-weight:450;line-height:1.15;letter-spacing:-.02em;margin-top:4px}
em{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-weight:450;color:var(--acc)}
.mut{color:var(--mut)}.sm{font-size:14px;color:var(--sm)}.chl .sm,.row>.sm{white-space:nowrap}.tabs{top:65px!important}
.hero{padding:28px 0 6px}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px}
.bar{flex:1;height:6px;border-radius:3px;background:#E9E4DA;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .5s}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--accbg);color:var(--ink);min-height:56px}
.resume b{font-weight:500}.resume .go{color:var(--acc);font-weight:500;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-top:22px;background:var(--soft);border-radius:12px;padding:4px;position:sticky;top:72px;z-index:4}
.tabs button{flex:1;padding:10px 0;border-radius:9px;font-size:15px;color:var(--mut);min-height:44px}
.tabs button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(19,40,91,.08)}
.item{border-bottom:1px solid var(--line)}
.ih{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px 0;min-height:68px}
.num{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:19px;color:var(--acc);margin-right:6px}
.st{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px}
.st.d{background:var(--acc);color:#fff}.st.n{border:1.5px solid #CFC8BB}.st.c{border:2px solid var(--acc);color:var(--acc);font-size:9px;padding-left:2px}
.chev{color:var(--sm);font-size:18px;transition:transform .25s;flex:none}.open .chev{transform:rotate(180deg)}
.ib{display:none;padding:0 0 18px 40px}.open .ib{display:block}
.ib .about{font-size:15px;color:var(--mut);margin-bottom:10px}
.chl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;background:var(--acc);color:#fff;font-weight:500;font-size:16px}
.btn.s{background:#fff;color:var(--ink);border:1px solid #DDD7CC}
.btn.full{display:flex;width:100%;height:56px;font-size:17px;margin-top:22px}
.mat{padding:18px 0;border-bottom:1px solid var(--line)}
.mat h3{font-size:18px;font-weight:450}.mat p{font-size:14.5px;color:var(--mut);margin-top:2px}
.back{display:inline-flex;align-items:center;gap:6px;padding:16px 0 10px;font-size:15px;color:var(--mut);min-height:44px}
.vid{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--ink);position:relative}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:20px;background:linear-gradient(160deg,#13285b,#1f4a73)}
.ph b{font-weight:450;font-size:18px;display:block}.ph span{font-size:14px;color:#c9d6ee}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%;text-align:left}
.row .t{flex:1;font-size:16px}
.row.todo{align-items:flex-start}.row.todo .chk{margin-top:2px}.todo .t b{font-weight:450;display:block}.todo .t span{font-size:14px;color:var(--mut)}
.chk{width:28px;height:28px;border-radius:8px;border:1.5px solid #CFC8BB;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.on>.chk,.chk.on{background:var(--acc);border-color:var(--acc)}
.st.d+.t{color:var(--mut)}
.note{font-size:13.5px;color:var(--sm);margin-top:14px}
.foot{padding:40px 0 60px;font-size:12.5px;color:var(--sm)}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;max-width:440px;margin:0 auto}
.login input{width:100%;height:56px;border-radius:12px;border:1px solid #DDD7CC;background:#fff;padding:0 16px;font:400 18px Geologica,sans-serif;color:var(--ink);margin-top:22px;outline:none}
.login input:focus{border-color:var(--acc)}
.err{color:#b4472a;font-size:14px;margin-top:10px;min-height:20px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="kick" style="margin-top:56px">кабинет участника</div>

</div>

const $=s=>document.querySelector(s), KEYS='mg_key', PK='mg_prog';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let DATA=null, KEY=null, P={};
try{P=JSON.parse(localStorage.getItem(PK)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(pt))}
async function start(){
 const saved=(()=>{try{return localStorage.getItem(KEYS)}catch(e){return null}})();
 if(saved){try{const key=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',true,['decrypt']);DATA=await open(key);KEY=key;return boot()}catch(e){}}
 $('#login').classList.remove('hide');
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='Проверяю…';
  try{const key=await derive($('#pw').value.trim());DATA=await open(key);KEY=key;
   try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem(KEYS,btoa(String.fromCharCode(...raw)))}catch(e){}
   $('#login').classList.add('hide');boot()}catch(e){$('#err').textContent='Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.'}}
}
const L=()=>DATA.lectures, lp=id=>(P[id]=P[id]||{ch:[],todo:[],done:false});
const isDone=l=>{const p=P[l.id];return !!(p&&(p.done||(p.ch&&l.ch.every((_,i)=>p.ch[i]))))};
const isStarted=l=>{const p=P[l.id];return !!(p&&((p.ch||[]).some(Boolean)||p.open))};
const label=id=>id[0]==='B'?'Бонус '+id[1]:'Лекция '+id;
const ttl=l=>(l.a?l.a+' ':'')+'<em>'+l.b+'</em>';
const stIcon=l=>isDone(l)?'<span class="st d">✓</span>':isStarted(l)?'<span class="st c">▶</span>':'<span class="st n"></span>';
let TAB='l', OPEN=null;
function boot(){$('#app').classList.remove('hide');window.onhashchange=route;route()}
function route(){const m=location.hash.match(/^#\/l\/(\w+)/);const l=m&&L().find(x=>x.id===m[1]);l?lecture(l):home();}
function topbar(){return `<div class="top"><div class="box"><a class="lk" href="#/"><img src="avatar.png" alt=""><div><b>ШЫНГЫС САДЫК</b><span>МЕТАБОЛИЧЕСКОЕ ЗДОРОВЬЕ</span></div></a>${DATA.chat?`<a class="chat" href="${DATA.chat}" target="_blank" rel="noopener">Чат потока</a>`:''}</div></div>`}
function home(){
 const all=L(), done=all.filter(isDone).length, next=all.find(l=>!isDone(l));
 const items=all.filter(l=>TAB==='l'?l.id[0]!=='B':l.id[0]==='B');
 let body='';
 if(TAB==='m'){body=DATA.materials.map(m=>`<div class="mat"><h3>${m.t}</h3><p>${m.d}</p><div class="acts">${m.html?`<a class="btn" href="#" data-f="${m.html}">${m.html_t}</a>`:''}<a class="btn ${m.html?'s':''}" href="#" data-f="${m.pdf}">Скачать PDF</a></div></div>`).join('')}
 else body=items.map(l=>`<div class="item ${OPEN===l.id?'open':''}" id="i${l.id}"><button class="ih" data-o="${l.id}">${stIcon(l)}<div style="flex:1"><span class="num">${l.id[0]==='B'?'Б'+l.id[1]:l.id}</span>${ttl(l)}<div class="sm">${l.min} мин · ${l.ch.length} глав</div></div><span class="chev">⌄</span></button>
  <div class="ib"><p class="about">${l.about}</p>${l.ch.map((c,i)=>`<div class="chl"><span>${(P[l.id]&&P[l.id].ch[i])?'✓ ':''}${c.t}</span><span class="sm">${c.m} мин</span></div>`).join('')}
  <div class="acts"><a class="btn" href="#/l/${l.id}">${isStarted(l)&&!isDone(l)?'Продолжить':'Смотреть'}</a><a class="btn s" href="#" data-f="${l.konspekt}">Конспект</a></div></div></div>`).join('');
 $('#app').innerHTML=topbar()+`<div class="box"><div class="hero"><h1>Мои <em>лекции</em></h1><p class="mut" style="margin-top:8px">Нажмите на лекцию, чтобы увидеть главы и материалы. Все лекции открыты сразу, порядок подсказывает, с чего начать.</p>
  <div class="prog"><div class="bar"><i style="width:${done/all.length*100}%"></i></div><span class="sm">${done} из ${all.length}</span></div>
  ${next?`<a class="resume" href="#/l/${next.id}"><span><span class="sm">${isStarted(next)?'Продолжить':'Начать'}</span><br><b>${label(next.id)}.</b> ${(next.a?next.a+' ':'')+next.b}</span><span class="go">→</span></a>`:`<div class="resume"><b>Все лекции пройдены. Поздравляю!</b></div>`}</div>
  <div class="tabs" role="tablist"><button data-t="l" class="${TAB==='l'?'on':''}">Лекции</button><button data-t="b" class="${TAB==='b'?'on':''}">Бонусы</button><button data-t="m" class="${TAB==='m'?'on':''}">Материалы</button></div>
  <div>${body}</div><div class="foot">© Шынгыс Садык · Метаболическое здоровье, 2026. Материалы только для участников курса, распространение без согласия автора запрещено. Отметки о просмотре хранятся на этом устройстве.</div></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;OPEN=null;home()});
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{OPEN=OPEN===b.dataset.o?null:b.dataset.o;home();const el=$('#i'+b.dataset.o);if(OPEN&&el)el.scrollIntoView({block:'nearest',behavior:'smooth'})});
}
function embed(u){if(!u)return'';let m;
 if(m=u.match(/kinescope\.io\/(?:embed\/)?([\w-]+)/))return'https://kinescope.io/embed/'+m[1];
 if(m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/))return'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0';
 if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/))return'https://player.vimeo.com/video/'+m[1]+(m[2]?'?h='+m[2]:'');
 return u}
let LT='c';
function lecture(l){
 const p=lp(l.id);p.open=true;save();
 const idx=L().indexOf(l), nx=L()[idx+1];
 const src=embed(l.video);
 const ex=DATA.materials.filter(m=>l.extra.includes(m.k));
 const tabC=l.ch.map((c,i)=>`<button class="row ${p.ch[i]?'on':''}" data-c="${i}"><span class="chk ${p.ch[i]?'on':''}">${p.ch[i]?'✓':''}</span><span class="t">${c.t}</span><span class="sm">${c.m} мин</span></button>`).join('')+`<p class="note">Отмечайте главы, которые посмотрели: так вы увидите прогресс и вернётесь туда, где остановились.</p>`;
 const tabM=`<div class="mat"><h3>Конспект лекции</h3><p>Главные мысли, схема, цифры и источники.</p><div class="acts"><a class="btn" href="#" data-f="${l.konspekt}">Открыть конспект</a></div></div>`+ex.map(m=>`<div class="mat"><h3>${m.t}</h3><p>${m.d}</p><div class="acts">${m.html?`<a class="btn s" href="#" data-f="${m.html}">${m.html_t}</a>`:''}<a class="btn s" href="#" data-f="${m.pdf}">PDF</a></div></div>`).join('');
 const tabT=`<p class="mut" style="margin:10px 0 4px">Что сделать на этой неделе. Отмечайте выполненное.</p>`+l.todo.map((t,i)=>`<button class="row todo ${p.todo[i]?'on':''}" data-d="${i}"><span class="chk ${p.todo[i]?'on':''}">${p.todo[i]?'✓':''}</span><span class="t"><b>${t}</b><span>${l.todo_p[i]||''}</span></span></button>`).join('');
 $('#app').innerHTML=topbar()+`<div class="box"><a class="back" href="#/">← Все лекции</a>
  <div class="vid">${src?`<iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen title="${label(l.id)}"></iframe>`:`<div class="ph"><div><b>Запись появится здесь</b><span>А пока можно открыть конспект лекции</span></div></div>`}</div>
  <div class="kick" style="margin-top:18px">${label(l.id).toLowerCase()} · ${l.min} мин</div><h2>${ttl(l)}</h2>
  <div class="tabs" style="top:72px"><button data-lt="c" class="${LT==='c'?'on':''}">Главы</button><button data-lt="m" class="${LT==='m'?'on':''}">Материалы</button><button data-lt="t" class="${LT==='t'?'on':''}">Задание</button></div>
  <div id="lt">${LT==='c'?tabC:LT==='m'?tabM:tabT}</div>
  <button class="btn full" id="fin">${isDone(l)?(nx?'Перейти к: '+label(nx.id).toLowerCase()+' →':'К списку лекций'):(nx?'Отметить и перейти к: '+label(nx.id).toLowerCase()+' →':'Отметить лекцию пройденной')}</button>
  <div class="foot">Видео и материалы только для участников курса.</div></div>`;
 window.scrollTo(0,0);
 document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{LT=b.dataset.lt;const y=scrollY;lecture(l);scrollTo(0,y)});
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;p.ch[i]=!p.ch[i];save();const y=scrollY;lecture(l);scrollTo(0,y)});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;p.todo[i]=!p.todo[i];save();const y=scrollY;lecture(l);scrollTo(0,y)});
 $('#fin').onclick=()=>{p.done=true;save();LT='c';location.hash=nx?'#/l/'+nx.id:'#/'};
}
const BLOBS={};
async function getFile(p){if(BLOBS[p])return BLOBS[p];const f=DATA.files[p];const r=await fetch(f.u,{cache:'no-store'});if(!r.ok)throw 0;const b=new Uint8Array(await r.arrayBuffer());
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12));return BLOBS[p]=URL.createObjectURL(new Blob([pt],{type:f.t}))}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-f]');if(!a)return;
 if(a.dataset.ready){return}
 e.preventDefault();let w=null;try{w=window.open('','_blank')}catch(_){}
 const t=a.textContent;a.textContent='Открываю…';
 try{const u=await getFile(a.dataset.f);let ok=false;
  if(w){try{w.location.href=u;ok=true}catch(_){try{w.close()}catch(__){}}}
  if(!ok){a.href=u;a.target='_blank';a.dataset.ready='1';a.textContent='Нажмите, чтобы открыть';return}
  a.textContent=t}
 catch(err){try{w&&w.close()}catch(_){}a.textContent='Не открылось, нажмите ещё раз'}});
start();
</script>
</body>
</html>
