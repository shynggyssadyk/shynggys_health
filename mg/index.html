const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mg',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kget(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('k').objectStore('k').get('key');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function kput(k){try{const db=await idb();await new Promise(r=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(k,'key');t.oncomplete=r;t.onerror=r})}catch(e){}}
async function kdel(){try{const db=await idb();await new Promise(r=>{const t=db.transaction('k','readwrite');t.objectStore('k').delete('key');t.oncomplete=r;t.onerror=r})}catch(e){}try{localStorage.removeItem('mg_key')}catch(e){}}
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:BLOB.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
let USERS=null;
async function unlock(code){if(!USERS){const r=await fetch('u.json?t='+Date.now(),{cache:'no-store'});USERS=await r.json()}const e=USERS[code.slice(2,6)];if(!e)throw 0;
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
 const dk=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(e.s),iterations:e.n,hash:'SHA-256'},base,256));
 const hk=await crypto.subtle.importKey('raw',dk,{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const mac=async(...parts)=>{let len=parts.reduce((a,p)=>a+p.length,0),buf=new Uint8Array(len),o=0;parts.forEach(p=>{buf.set(p,o);o+=p.length});return new Uint8Array(await crypto.subtle.sign('HMAC',hk,buf))};
 const ct=b64(e.c),te=new TextEncoder();const tag=(await mac(te.encode('mac'),ct)).slice(0,16);const want=b64(e.m);if(tag.length!==want.length||tag.some((x,i)=>x!==want[i]))throw 0;
 const pt=new Uint8Array(ct.length);for(let i=0,blk=0;i<ct.length;blk++){const ks=await mac(te.encode('enc'),new Uint8Array([blk>>>24&255,blk>>>16&255,blk>>>8&255,blk&255]));for(let j=0;j<32&&i<ct.length;j++,i++)pt[i]=ct[i]^ks[j]}
 const prof=JSON.parse(new TextDecoder().decode(pt));const key=await crypto.subtle.importKey('raw',b64(prof.k),'AES-GCM',false,['decrypt']);return {key,prof}}
async function decryptData(key){for(const X of [BLOB,BLOBT]){if(!X)continue;try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(X.i)},key,b64(X.c));return JSON.parse(new TextDecoder().decode(pt))}catch(e){}}throw 0}

const norm=s=>lay(s.normalize('NFKC').toLowerCase()).replace(/[^a-z0-9]/g,'');
function cands(v){const out=[];const t=lay(v.normalize('NFKC').toLowerCase());(t.match(/mg[\s\-–—_]*[a-z0-9]{4}[\s\-–—_]*[a-z0-9]{8}/g)||[]).forEach(x=>out.push(x.replace(/[^a-z0-9]/g,'')));const n=norm(v);if(n.startsWith('mg'))out.push(n.slice(0,14));out.push(n);if(!n.startsWith('mg')&&n.length===12)out.push('mg'+n);return [...new Set(out)].filter(x=>x.length===14&&x.startsWith('mg')).slice(0,6)}

 try{localStorage.removeItem('mg_key')}catch(e){}

}
