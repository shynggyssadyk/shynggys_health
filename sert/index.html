.st.bad{color:#b4372b;background:rgba(229,72,58,.10)}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--c,var(--green));flex:none;animation:beat 1.6s ease-in-out infinite}
.bad .dot{--c:var(--red)}
.dot:before,.dot:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--c,var(--green));animation:ring 1.6s ease-out infinite}
.dot:after{animation-delay:.8s}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
h1{font-size:34px;font-weight:560;letter-spacing:-.5px;margin-top:14px;line-height:1.12}
p{font-size:15px;color:var(--gray);line-height:1.5;margin-top:8px}
.rows{margin-top:18px}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e6e2da;padding:11px 0;font-size:14.5px}.row span{color:var(--gray)}.row b{font-weight:550}

.soc svg{width:24px;height:24px;flex:none}
.bar{height:5px;margin:22px -26px 0;background:linear-gradient(90deg,#14808a,#38c6d4 60%,#a9d3f2)}
@media (max-width:400px){.card{padding:22px 18px 0}.bar{margin:22px -18px 0}h1{font-size:30px}.lock .av{width:44px;height:44px}}
